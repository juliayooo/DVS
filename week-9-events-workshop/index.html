<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leaflet JS Workshop</title>

  <script src="/lib/leaflet/leaflet.js"></script>
  <script src="/lib/d3.v7.min.js"></script>
  <link rel="stylesheet" href="/lib/leaflet/leaflet.css" />

  <style>
    body {
      font-family: sans-serif;
    }

    /* the map div _must_ have a defined height */
    #map {
      height: 800px;
    }

    #controls {
      margin-top: 1rem;
      display: flex;

      label {
        font-weight: bold;
      }

      .left {
        flex: 1
      }

      .right {
        flex: 1;
        text-align: right;
      }
    }
  </style>

</head>

<body>
  <h1>Interactive Visualisation with Events</h1>

  <div id="map"></div>

  <div id="controls">
    <div class="left">
      <label for="startyear">Start year:</label>
      <input id="startyear" value=300 />
      <span id="startyear-number"></span>

      <label for="startyear">End year:</label>
      <input id="endyear" value=2025 />
      <span id="endyear-number"></span>
    </div>
    <div class="right">
      <button id="reset">Reset map</button>
      <button id="findme">Find me</button>
    </div>
  </div>

  <script lang="text/javascript">
    // global variables
    let map;
    let markerLayer;
    let allMeteorites;

    let startYear = 300;
    let endYear = 2025;

    // map fields we want from the GeoJSON to printable Names
    const tableColumns = {
      year: "Year",
      mass: "Mass",
      fall: "Fell/Observed?",
      recclass: "Class",
    };

    // draw all meteorite discoveries between FROM and TO
    const drawMeteorites = (from, to) => {
      if (markerLayer) {
        map.removeLayer(markerLayer);
      }

      let markers = [];
      let filteredMeteorites = allMeteorites;

      // filter by from/to years
      if (from) {
        // TODO: filteredMeteorites should begin at FROM year
      }

      if (to) {
        // TODO: filteredMeteorites should end at TO year
      }

      filteredMeteorites.forEach((m) => {
        // make a set of table rows for this meteorite for each field
        const tableRows = Object.keys(tableColumns)
          .map((col) => `<tr><th>${tableColumns[col]}</th><td>${m[col]}</td>`)
          .join("");

        const marker = L.circleMarker([m.reclat, m.reclong], {
          // stroke: false,
          weight: 1,
          opacity: 0.5,
          color: "#eee",
          fill: true,
          fillColor: "blue",
          fillOpacity: 0.8,
          radius: 5,
        }).bindPopup(`<h3>${m.name}</h3><table>${tableRows}</table>`);
        markers.push(marker);
      });
      markerLayer = L.featureGroup(markers);
      markerLayer.addTo(map);
    };

    // begin main display code

    map = L.map("map");

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);

    map.setView([0, 0], 2);

    fetch("/data/meteorites.json").then((response) => {
      response.json().then((data) => {
        allMeteorites = data;
        drawMeteorites(startYear, endYear);
      });
    });

  </script>
</body>

</html>
