<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leaflet JS Workshop</title>

  <script src="/lib/leaflet/leaflet.js"></script>
  <script src="/lib/d3.v7.min.js"></script>
  <link rel="stylesheet" href="/lib/leaflet/leaflet.css" />

  <style>
    body {
      font-family: sans-serif;
    }

    /* the map div _must_ have a defined height */
    #map {
      height: 800px;
    }

    #controls {
      margin-top: 1rem;
      display: flex;

      label {
        font-weight: bold;
      }

      .left {
        flex: 1
      }

      .right {
        flex: 1;
        text-align: right;
      }
    }
  </style>

</head>

<body>
  <h1>Interactive Visualisation with Events</h1>

  <div id="map"></div>

  <div id="controls">
    <div class="left">
      <label for="startyear">Start year:</label>
      <input id="startyear" value=300 min="300" max="2025" type="range"/>
      <span id="startyear-number"></span>

      <label for="startyear">End year:</label>
      <input id="endyear" value=2025 min="300" max="2025" type="range"/>
      <span id="endyear-number"></span>
    </div>
    <div class="right">
      <button id="reset">Reset map</button>
      <button id="findme">Find me</button>
    </div>
  </div>

  <script lang="text/javascript">


    // reset button functionality 
    const reset = document.getElementById("reset");
    reset.addEventListener("click", (e) => {
      map.setView([0, 0], 2);

    });


    // find me button functionality 
    const findme = document.getElementById("findme");
    findme.addEventListener("click", (e) => {
      navigator.geolocation.getCurrentPosition((position) => {
        const lat = position.coords.latitude;
        const long = position.coords.longitude;
        map.setView([lat, long], 13);
      });
    });


    // start year input functionality
    const startyear = document.getElementById("startyear");
    startyear.addEventListener("input", (e) => {
      console.log("changed to " + e.target.value);
      startYear = parseInt(e.target.value);
      drawMeteorites(e.target.value, endYear);
    });
     // end year input functionality
     const endyear = document.getElementById("endyear");
    endyear.addEventListener("input", (e) => {
      endYear = parseInt(e.target.value);
      console.log("end changed to " + e.target.value);
      drawMeteorites(startyear, e.target.value);

    });

    // global variables
    let map;
    let markerLayer;
    let allMeteorites;

    let startYear = 300;
    let endYear = 2025;

    // map fields we want from the GeoJSON to printable Names
    const tableColumns = {
      year: "Year",
      mass: "Mass",
      fall: "Fell/Observed?",
      recclass: "Class",
    };

    // draw all meteorite discoveries between FROM and TO
    const drawMeteorites = (from, to) => {
      if (markerLayer) {
        map.removeLayer(markerLayer);
      }

      let markers = [];
      let filteredMeteorites = allMeteorites;

      // filter by from/to years
      
      if (from) {

        // for (let i = allMeteorites.length; i >= 0; i--) {
        //   if (filteredMeteorites[i]["year"] < from) {
        //     filteredMeteorites.splice(i, 1);
        //   }
        // }       
        //  console.log(filteredMeteorites.length);

        filteredMeteorites = allMeteorites.filter((m) => {
          return m.year >= startYear;
        });
      //   filteredMeteorites = [];
      //   allMeteorites.forEach((meteorite)=>{
      //     if (meteorite.year >= from) {
      //       filteredMeteorites.push(meteorite);
      //     }
      // });
      }
        // TODO: filteredMeteorites should begin at FROM year
      
      if (to) {

        filteredMeteorites = filteredMeteorites.filter((m) => {
          return m.year <= endYear;
        });
        // for (let i = filteredMeteorites.length; i >= 0; i--) {
        //   if (filteredMeteorites[i]["year"] > to) {
        //     filteredMeteorites.splice(i, 1);
        //   }
        // }
        // console.log(filteredMeteorites.length);



      //   allMeteorites.forEach((meteorite)=>{
      //     if (meteorite.year <= to) {
      //       filteredMeteorites.push(meteorite);
      //     }
      // });
        // TODO: filteredMeteorites should end at TO year
      }

      filteredMeteorites.forEach((m) => {
        // make a set of table rows for this meteorite for each field
        const tableRows = Object.keys(tableColumns)
          .map((col) => `<tr><th>${tableColumns[col]}</th><td>${m[col]}</td>`)
          .join("");

        const marker = L.circleMarker([m.reclat, m.reclong], {
          // stroke: false,
          weight: 1,
          opacity: 0.5,
          color: "#eee",
          fill: true,
          fillColor: "blue",
          fillOpacity: 0.8,
          radius: 5,
        }).bindPopup(`<h3>${m.name}</h3><table>${tableRows}</table>`);
        markers.push(marker);
      });
      markerLayer = L.featureGroup(markers);
      markerLayer.addTo(map);
    };

    // begin main display code

    map = L.map("map");

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }).addTo(map);

    map.setView([0, 0], 2);

    fetch("/data/meteorites.json").then((response) => {
      response.json().then((data) => {
        allMeteorites = data;
        drawMeteorites(startYear, endYear);
        console.log(allMeteorites);
      });
    });

  </script>
</body>

</html>
