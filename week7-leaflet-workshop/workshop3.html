<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Leaflet JS Workshop</title>

  <script src="./lib/leaflet/leaflet.js"></script>
  <link rel="stylesheet" href="./lib/leaflet/leaflet.css" />

  <style>
    body {
      font-family: sans-serif;
    }

    /* the map div _must_ have a defined height */
    #map {
      height: 800px;
    }
  </style>
<link rel=
"stylesheet" href=
"./lib/leaflet-marker-cluster/MarkerCluster.css" />
<link
rel=
"stylesheet"
href=
"./lib/leaflet-marker-cluster/MarkerCluster.Default.css"
/>
<script src=
"./lib/leaflet-marker-cluster/leaflet.markercluster.js"></script>
</head>

<body>
  <h1>Maps Workshop</h1>

  <div id="map"></div>

  <script lang="text/javascript">

  
    const map = L.map("map");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
      '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      }).addTo(map);

      map.setView([0,0], 3);

      fetch("./data/meteorites.json").then((response) => {
        // data is your Response object
        response.json().then((meteorites) => {
          const clusterGroup = L.markerClusterGroup();
          meteorites.forEach(m => {
            clusterGroup.addLayer(L.marker([m.reclat, m.reclong]).bindPopup(m.name));
            // L.circleMarker([m.reclat, m.reclong]).bindPopup(m.name).addTo(map);
          })
          
          map.addLayer(clusterGroup);
   
        // geoJson is a Javascript object corresponding
        // to the json in the file
        //
        // do something with that JSON data!
        });
      });
   
       
            
    // *** All your JS code should go here. ***
    //
    // your code needs to run _after_ the div the map will
    // be put in is added to the DOM container exists.
    // the easiest way to do this is to put it at the end of the
    // body.
    // (Alternatively, you can put it wherever _if_ you put it inside
    // a callback that fires on the document's `ready` event)

  </script>
</body>

</html>
